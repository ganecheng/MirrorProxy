name: 发布

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 📦 前端控制台与 GeoIP
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5
      - name: ⚙️ 安装 Node.js
        id: node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 📚 安装锁定版本的前端依赖
        working-directory: web
        run: npm ci
      - name: 🔨 构建 Web 控制台
        uses: ./.github/actions/build-web
        with:
          node-version: ${{ steps.node.outputs.node-version }}
      - name: ⬆️ 上传前端产物
        uses: actions/upload-artifact@v6
        with:
          name: release-web-console
          path: |
            web/dist
            target/frontend-artifact.json
          retention-days: 1
          if-no-files-found: error
      - name: 🗂️ 缓存 GeoIP 数据
        uses: actions/cache@v5
        with:
          path: geoip/*.xdb
          key: geoip-v1-${{ hashFiles('scripts/fetch-geoip.sh') }}
      - name: 🗺️ 获取并校验 GeoIP
        run: bash scripts/fetch-geoip.sh
      - name: ⬆️ 上传 GeoIP 数据
        uses: actions/upload-artifact@v6
        with:
          name: release-geoip
          path: geoip/*.xdb
          retention-days: 1
          if-no-files-found: error

  server:
    name: 🖥️ 服务端 (${{ matrix.target }})
    needs: frontend
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            archive: mirrorproxy-server-x86_64-unknown-linux-musl.tar.gz
          - target: aarch64-unknown-linux-gnu
            archive: mirrorproxy-server-aarch64-unknown-linux-gnu.tar.gz
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5
      - name: 🦀 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: 🗂️ 缓存 Rust 构建
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3, Node 24
        with:
          prefix-key: mirrorproxy-rust-v1
          shared-key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-release-server
          env-vars: CARGO CC CFLAGS CXX CMAKE RUST OPENSSL PKG_CONFIG AR
      - name: ⬇️ 下载前端产物
        uses: ./.github/actions/download-web
        with:
          name: release-web-console
      - name: ⬇️ 下载 GeoIP 数据
        uses: actions/download-artifact@v8
        with:
          name: release-geoip
          path: geoip
      - name: 🔧 安装 musl 链接器
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: 🔧 安装 ARM64 链接器
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu
      - name: 🔨 构建服务端
        run: |
          GIT_COMMIT="${GITHUB_SHA}" \
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          cargo build --locked --release -p mirrorproxy-server --target ${{ matrix.target }}
      - name: 📦 打包服务端归档
        run: |
          staging="mirrorproxy-server-${{ matrix.target }}"
          mkdir "$staging"
          cp "target/${{ matrix.target }}/release/mirrorproxy-server" "$staging/mirrorproxy-server"
          cp config.example.toml "$staging/config.example.toml"
          cp -R geoip "$staging/geoip"
          chmod +x "$staging/mirrorproxy-server"
          tar -czf "${{ matrix.archive }}" -C "$staging" mirrorproxy-server config.example.toml geoip
          shasum -a 256 "${{ matrix.archive }}" >"${{ matrix.archive }}.sha256"
      - name: ⬆️ 上传服务端产物
        uses: actions/upload-artifact@v6
        with:
          name: server-${{ matrix.target }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error

  publish:
    name: 🚀 发布 GitHub Release
    needs: server
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v5
      - name: ⬇️ 下载服务端产物
        uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: release-artifacts
      - name: 🧾 汇总 SHA256SUMS
        run: |
          find release-artifacts -name '*.sha256' -print0 | sort -z | xargs -0 cat >SHA256SUMS
      - name: 📝 生成发布说明
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/generate-release-body.py release-artifacts "$GITHUB_REPOSITORY" "$RELEASE_TAG" release-body.md
      - name: 🚀 发布版本
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          body_path: release-body.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/**/*
            SHA256SUMS
